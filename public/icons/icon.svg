<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Outer focus ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="18" stroke-linecap="round" stroke-dasharray="750 250" filter="url(#glow)"/>
  
  <!-- Camera Body -->
  <rect x="160" y="196" width="192" height="140" rx="28" fill="#1e293b" stroke="#334155" stroke-width="6" />
  <path d="M 216 196 L 232 168 L 280 168 L 296 196 Z" fill="#334155" />
  
  <!-- Camera Lens with glowing focus center -->
  <circle cx="256" cy="266" r="48" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="8"/>
  <circle cx="256" cy="266" r="28" fill="#6366f1" opacity="0.8" filter="url(#glow)"/>
  <circle cx="244" cy="254" r="8" fill="#ffffff" opacity="0.9"/>

  <!-- Small top right badge: Flame -->
  <g transform="translate(340, 130) scale(0.65)">
    <circle cx="50" cy="50" r="44" fill="#0f172a" stroke="#f97316" stroke-width="4"/>
    <path d="M 50 16 C 50 16 30 40 30 58 C 30 72 40 82 50 82 C 60 82 70 72 70 58 C 70 40 50 16 50 16 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  </g>
</svg>
